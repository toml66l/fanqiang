name: IndexNow 每日定時提交

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  indexnow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 🌟 必須先 Checkout 專案
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 執行 IndexNow 提交
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://906202.xyz/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          # 🌟 移除 since 和 since-unit，直接全量提交 sitemap 中的所有網址
