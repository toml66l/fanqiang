name: 自動生成 Sitemap 並提交 IndexNow

on:
  push:
    branches:
      - main  # 🌟 需求符合：只有當推送到主分支時才觸發
    paths:
      - 'README.md'      # 🌟 需求符合：監控 README.md 更新
      - '**.md'          # 🌟 需求符合：監控任何根目錄或子目錄下的 Markdown 文檔更新
      # 如果你有特定的文檔資料夾，'**.md' 已經全面自動包含

  workflow_dispatch: # 保留手動觸發按鈕，方便隨時測試

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 允許把自動生成的 sitemap.xml 推回你的倉庫
    steps:
      # 1. 下載專案原始碼（設定 fetch-depth: 0 才能讀取到正確的檔案修改日期）
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. 🌟 需求符合：自動掃描專案，生成帶有正確修改日期（lastmod）的 sitemap.xml
      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://906202.xyz

      # 3. 檢查 sitemap.xml 是否有變動，有的話就自動 Commit 並推回你的 GitHub 倉庫
      - name: Commit and Push Sitemap
        run: |
          git config --local user.email "175387347+toml66l@users.noreply.github.com"
          git config --local user.name "toml66l"
          git add sitemap.xml
          # [skip ci] 可以防止這次推包引發無限循環觸發
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update [skip ci]" && git push)

      # 4. 🌟 關鍵修正：動態等待，每 10 秒檢查一次線上 sitemap 是否已更新，最多等 3 分鐘
      # 這樣可以確保 GitHub Pages 後台部署完成後，才進行下一步
      - name: Wait for Online Sitemap to Sync
        run: |
          echo "等待 GitHub Pages 線上部署更新..."
          for i in {1..18}; do
            echo "檢查線上 Sitemap 中... (嘗試 $i/18)"
            # 這裡透過網路抓取線上的 sitemap 進行確認
            curl -sL https://906202.xyz/sitemap.xml > /tmp/online_sitemap.xml
            if grep -q "https://906202.xyz" /tmp/online_sitemap.xml; then
               echo "線上 Sitemap 已就緒！"
               break
            fi
            sleep 10
          done

      # 5. 🌟 需求符合 & 關鍵修正：執行 IndexNow 提交
      - name: 執行 IndexNow 提交
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://906202.xyz/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          since: 1
          since-unit: 'day'
          # 🌟 終極修復：強制外掛從遠端伺服器（Server）抓取 XML，避開本地檔案，防止再次噴出 Expected closing tag 錯誤！
          force-server: true 

