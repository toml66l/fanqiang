name: 自動生成 Sitemap 並提交 IndexNow

on:
  push:
    branches:
      - main  # 🌟 只有推送到主分支時才觸發
    paths:
      - 'README.md'      # 🌟 監控 README.md 更新
      - '**.md'          # 🌟 監控任何根目錄或子目錄下的 Markdown 文檔更新
      # 如果你有特定的文檔目錄（例如 docs/ 或 posts/），上面的 '**.md' 已經全面包含了。
      # 你也可以在這裡精確指定目錄，例如： - 'docs/**'
  workflow_dispatch: # 🌟 保留手動按鈕，方便你隨時測試

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 🌟 必須是 write，因為 Actions 需要把自動生成的 sitemap.xml 推回你的倉庫
    steps:
      # 1. 下載專案原始碼（必須設定 fetch-depth: 0 才能讀取到正確的檔案修改日期）
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      # 2. 自動掃描專案，生成帶有正確修改日期的 sitemap.xml
      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://906202.xyz

      # 3. 檢查 sitemap.xml 是否有變動，有的話就自動 Commit 並推回你的 GitHub 倉庫
      - name: Commit and Push Sitemap
        run: |
          git config --local user.email "175387347+toml66l@users.noreply.github.com"
          git config --local user.name "toml66l"
          git add sitemap.xml
          # 如果 sitemap 沒有任何實質變動就不動作，有變動才提交推送
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update [skip ci]" && git push)

      # 4. 延遲 10 秒（確保 GitHub Pages 有時間更新線上檔案），然後執行你原本會通的 IndexNow 提交
      - name: Wait for Deployment
        run: sleep 60

      - name: 執行 IndexNow 提交
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://906202.xyz/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          since: 1
          since-unit: 'day'
