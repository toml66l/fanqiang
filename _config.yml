tagline: "大流量不清零多节点机场,小火箭,clash多平台可用"
description: "自用精选机场推荐,Clash与Shadowrocket小火箭专属高速优质机场,包含全网少有的大流量按量付费、不清零、超多节点、无审计机场推荐，以及自用中转站等其他优惠或者免费资源推荐"

titles_from_headings:
  enabled: false

# ========== 插件清单（Bing必备：seo‑tag生成meta；sitemap输出sitemap.xml） ==========
plugins:
  - jekyll‑seo‑tag
  - jekyll‑sitemap
  - jekyll‑feed

# ========== jekyll‑seo‑tag高级，Bing友好配置 ==========
seo_tag:
  title: true
  description: true
  canonical_url: true
  open_graph: true
  twitter_card: true
  json_ld: true
